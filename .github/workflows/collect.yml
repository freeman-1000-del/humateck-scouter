name: Global Daily Scout Collect

# 16-country mostPopular → kind=popular (English Content Scouter)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check secrets (names only)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          yt="${{ secrets.YOUTUBE_API_KEY != '' }}"
          url="${{ secrets.SUPABASE_URL != '' }}"
          sk="${{ secrets.SUPABASE_SERVICE_KEY != '' }}"
          srk="${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "YOUTUBE_API_KEY set: $yt"
          echo "SUPABASE_URL set: $url"
          echo "SUPABASE_SERVICE_KEY set: $sk"
          echo "SUPABASE_SERVICE_ROLE_KEY set: $srk"
          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL host: $(node -e "try{const u=new URL(process.env.SUPABASE_URL.trim()); console.log(u.host)}catch(e){console.log('INVALID_URL')}")"
          fi
          if [ "$yt" != "true" ]; then echo "::error::Missing secret YOUTUBE_API_KEY"; exit 1; fi
          if [ "$url" != "true" ]; then echo "::error::Missing secret SUPABASE_URL"; exit 1; fi
          if [ "$sk" != "true" ] && [ "$srk" != "true" ]; then
            echo "::error::Missing secret SUPABASE_SERVICE_KEY (or SUPABASE_SERVICE_ROLE_KEY)"
            exit 1
          fi

      - name: Run global collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node fetch-global.mjs
